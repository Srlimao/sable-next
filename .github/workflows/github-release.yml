name: Build Windows Setup & GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v26.11.4). Leave empty to use package.json version.'
        required: false
        type: string
      flavor:
        description: 'Build flavor'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - nightly

permissions: {}

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
  CARGO_TERM_COLOR: always

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      flavor: ${{ steps.meta.outputs.flavor }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            version="${tag#v}"
          else
            version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            tag="v$version"
          fi
          flavor="${INPUT_FLAVOR:-stable}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"

      - name: Set up app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          SABLE_BUILD_FLAVOR: ${{ steps.meta.outputs.flavor }}

      - name: Upload web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-assets
          path: |
            .svelte-kit/output
            dist
            src/generated/wasm
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows setup & publish release
    needs: [build-web]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-web.outputs.version }}
      TAG: ${{ needs.build-web.outputs.tag }}
      VITE_APP_VERSION: ${{ needs.build-web.outputs.version }}
      SABLE_BUILD_FLAVOR: ${{ needs.build-web.outputs.flavor }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-assets

      - name: Set up app
        uses: ./.github/actions/setup
        with:
          rust: 'true'
          rust-cache-key: electron-Windows-X64
          install-mise-tools: 'false'

      - name: Package Windows setup
        shell: bash
        run: |
          # Git Bash's perl lacks modules that OpenSSL's Configure loads.
          export OPENSSL_SRC_PERL='C:/Strawberry/perl/bin/perl.exe'
          pnpm --dir electron package --win
          ls -lh electron/release

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ needs.build-web.outputs.flavor }}
        run: |
          shopt -s nullglob
          files=(
            electron/release/*.exe
            electron/release/*.msi
            electron/release/*.blockmap
            electron/release/latest*.yml
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Windows installer files were produced in electron/release." >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            extra_args=()
            if [ "$FLAVOR" = "nightly" ]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sable $VERSION ($FLAVOR)" \
              --notes "Windows setup built from commit $GITHUB_SHA ($FLAVOR flavor)." \
              "${extra_args[@]}"
          fi
